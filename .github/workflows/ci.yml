name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run lint
      run: pnpm run lint

    - name: Build
      run: pnpm run build

    - name: Run typecheck
      run: pnpm run typecheck

    - name: Run tests
      run: pnpm -r test
      continue-on-error: ${{ matrix.node-version == '26.x' }}

  build-with-socketio:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install socket.io
      run: pnpm add socket.io@^4.0.0 --filter @kerith/app

    - name: Build @kerith/app with socket.io present
      run: pnpm run build

    - name: Typecheck @kerith/app with socket.io present
      run: pnpm --filter @kerith/app run typecheck
